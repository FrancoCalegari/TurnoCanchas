<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta name="theme-color" content="#161d2e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Servicio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        dark: '#060e18'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center text-slate-100 bg-[#060e18] selection:bg-indigo-500/30 p-4">
    
    <div class="w-full max-w-md bg-[#181c28] border border-slate-700/60 rounded-2xl p-8 sm:p-10 shadow-xl">
        <a href="/loginuser.html" class="text-sm font-bold text-slate-400 hover:text-white transition-colors flex items-center gap-2 group mb-8 w-max">
            <svg class="group-hover:-translate-x-1 transition-transform" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Volver
        </a>

        <div class="text-left mb-8">
            <h2 class="text-3xl font-black text-white mb-2">Recuperar contraseña</h2>
            <p class="text-slate-400 font-medium">Ingresa el correo electrónico asociado a tu cuenta para enviarte un enlace de recuperación.</p>
        </div>
        
        <form id="forgot-form" class="space-y-5">
            <div class="space-y-1.5">
                <label class="block text-sm font-bold text-slate-300">Correo Electrónico</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                    <input type="email" id="email" required placeholder="tu@email.com" class="w-full bg-[#060e18] border border-slate-700/60 rounded-xl pl-11 pr-4 py-3.5 text-sm font-semibold text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600">
                </div>
            </div>
            
            <div id="error-msg" class="text-rose-400 text-xs font-bold hidden text-center bg-rose-500/10 border border-rose-500/20 rounded-xl p-3"></div>
            <div id="success-msg" class="text-emerald-400 text-xs font-bold hidden text-center bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3"></div>

            <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm py-4 rounded-xl transition-all shadow-[0_0_20px_-5px_rgba(79,70,229,0.4)] hover:shadow-[0_0_30px_-5px_rgba(79,70,229,0.6)] mt-4 flex justify-center items-center gap-2 group/btn">
                <span>Enviar enlace</span>
                <svg class="group-hover/btn:translate-x-1 transition-transform" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const email = document.getElementById('email').value;
            const btnText = btn.querySelector('span');
            
            btn.disabled = true;
            btnText.innerText = 'Enviando...';
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            
            try {
                const res = await fetch('/api/auth/cliente/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Ocurrió un error');
                
                successMsg.innerText = data.message;
                successMsg.classList.remove('hidden');
                document.getElementById('email').value = '';
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.innerText = 'Enviar enlace';
            }
        });
    </script>
</body>
</html>
