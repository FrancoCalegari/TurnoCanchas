<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Turnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/api.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-blue-600 dark:text-blue-400 mb-2">Ingresar</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Accedé a tu cuenta para gestionar tus turnos.</p>
        </div>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <div id="error-msg" class="text-rose-500 text-xs font-bold hidden text-center"></div>

            <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-sm py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/30">
                Iniciar Sesión
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm font-bold text-slate-500">
            ¿No tenés cuenta? <a href="/registeruser.html" class="text-blue-600 hover:underline">Registrate acá</a>
        </div>
        <div class="mt-4 text-center">
            <a href="/" class="text-xs font-bold text-slate-400 hover:text-slate-600 dark:hover:text-slate-300">← Volver al inicio</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.innerText = 'Ingresando...';
            errorMsg.classList.add('hidden');
            
            try {
                await window.API.clientLogin(email, password);
                window.location.href = '/';
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
