<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50 dark:bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción de Plataforma - Master Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col font-sans text-slate-900 dark:text-slate-100 antialiased">

    <!-- Header -->
    <header class="bg-indigo-900 border-b border-indigo-950 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-indigo-400 flex items-center justify-center text-white shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-server w-4 h-4"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
                    </div>
                    <h1 class="text-xl font-black tracking-tight text-white">SaaS<span class="text-indigo-400">Control</span></h1>
                </div>
                
                <!-- Boton Logout -->
                <button id="btn-master-logout" class="px-4 py-2 rounded-xl text-sm font-bold bg-white/10 hover:bg-white/20 text-white transition-all shadow-sm flex items-center gap-2 cursor-pointer border border-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out w-4 h-4"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
                    Salir
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
        
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-black tracking-tight">Estado de la Suscripción</h2>
            <p class="text-slate-500 dark:text-slate-400">Administra el acceso a la plataforma TurnoCanchas para este cliente.</p>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden p-8 flex flex-col md:flex-row gap-8 items-center">
            
            <div class="flex-1 space-y-6 w-full">
                <!-- Status Badge -->
                <div class="flex items-center gap-3">
                    <span class="text-sm font-bold text-slate-500 uppercase tracking-widest">Estado Actual</span>
                    <div id="plat-estado-badge" class="px-3 py-1 rounded-full text-sm font-black border bg-slate-100 text-slate-500">Cargando...</div>
                </div>

                <!-- Expiration Date -->
                <div>
                    <span class="text-sm font-bold text-slate-500 uppercase tracking-widest block mb-1">Vencimiento</span>
                    <p id="plat-vencimiento" class="text-2xl font-black text-slate-900 dark:text-white">--/--/----</p>
                </div>

                <!-- Demo Mode Status -->
                <div class="flex items-center gap-3 mt-4">
                    <span class="text-sm font-bold text-slate-500 uppercase tracking-widest">Modo Demo</span>
                    <button id="btn-toggle-demo" class="px-3 py-1 rounded-full text-sm font-black border transition-colors bg-slate-100 text-slate-500">Cargando...</button>
                </div>

                <hr class="border-slate-100 dark:border-slate-800">

                <!-- Actions -->
                <div class="flex flex-col gap-3">
                    <h3 class="font-bold text-slate-700 dark:text-slate-300">Renovar Suscripción</h3>
                    <div class="flex gap-2">
                        <button id="btn-add-1m" class="flex-1 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 dark:text-indigo-300 rounded-xl font-bold transition-colors border border-indigo-200 dark:border-indigo-800">+ 1 Mes</button>
                        <button id="btn-add-6m" class="flex-1 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 dark:text-indigo-300 rounded-xl font-bold transition-colors border border-indigo-200 dark:border-indigo-800">+ 6 Meses</button>
                    </div>
                </div>
            </div>

            <!-- Danger Zone -->
            <div class="w-full md:w-64 flex flex-col gap-4 p-6 bg-rose-50 dark:bg-rose-950/20 rounded-2xl border border-rose-100 dark:border-rose-900/30">
                <h3 class="font-black text-rose-700 dark:text-rose-400 text-center">Zona de Peligro</h3>
                <p class="text-xs text-rose-600/80 dark:text-rose-400/80 text-center font-medium">Estas acciones afectarán inmediatamente la plataforma del cliente.</p>
                
                <button id="btn-toggle-status" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-black transition-colors shadow-lg shadow-rose-600/20 mt-2">
                    Suspender Servicio
                </button>
            </div>

        </div>

    </main>

    <!-- Alert Modal (Reused Logic) -->
    <div id="alert-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-2xl w-full max-w-sm overflow-hidden scale-95 opacity-0 transition-all duration-300 transform" id="alert-modal-content">
            <div class="p-6">
                <div id="alert-modal-icon" class="w-12 h-12 rounded-full mb-4 mx-auto flex items-center justify-center"></div>
                <h3 id="alert-modal-title" class="text-xl font-black text-center text-slate-900 dark:text-white mb-2"></h3>
                <p id="alert-modal-text" class="text-sm text-center text-slate-500 dark:text-slate-400 font-medium"></p>
            </div>
            <div class="border-t border-slate-100 dark:border-slate-800">
                <button id="alert-btn-accept" class="w-full py-4 text-sm font-black text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/masteradmin.js"></script>
</body>
</html>
