<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta name="theme-color" content="#161d2e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nueva Contraseña - Servicio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981',
                        dark: '#060e18'
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center text-slate-100 bg-[#060e18] selection:bg-indigo-500/30 p-4">
    
    <div class="w-full max-w-md bg-[#181c28] border border-slate-700/60 rounded-2xl p-8 sm:p-10 shadow-xl">
        <div class="text-left mb-8">
            <h2 class="text-3xl font-black text-white mb-2">Nueva contraseña</h2>
            <p class="text-slate-400 font-medium">Ingresa tu nueva contraseña para acceder a tu cuenta.</p>
        </div>
        
        <form id="reset-form" class="space-y-5">
            <div class="space-y-1.5">
                <label class="block text-sm font-bold text-slate-300">Nueva Contraseña</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" id="newPassword" required placeholder="••••••••" class="w-full bg-[#060e18] border border-slate-700/60 rounded-xl pl-11 pr-4 py-3.5 text-sm font-semibold text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block text-sm font-bold text-slate-300">Confirmar Contraseña</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full bg-[#060e18] border border-slate-700/60 rounded-xl pl-11 pr-4 py-3.5 text-sm font-semibold text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder:text-slate-600">
                </div>
            </div>
            
            <div id="error-msg" class="text-rose-400 text-xs font-bold hidden text-center bg-rose-500/10 border border-rose-500/20 rounded-xl p-3"></div>
            <div id="success-msg" class="text-emerald-400 text-xs font-bold hidden text-center bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3"></div>

            <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black text-sm py-4 rounded-xl transition-all shadow-[0_0_20px_-5px_rgba(79,70,229,0.4)] hover:shadow-[0_0_30px_-5px_rgba(79,70,229,0.6)] mt-4 flex justify-center items-center gap-2 group/btn">
                <span>Guardar Contraseña</span>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnText = btn.querySelector('span');
            
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errorMsg.innerText = 'Las contraseñas no coinciden.';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            // Obtener token de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                errorMsg.innerText = 'Token inválido o ausente.';
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btnText.innerText = 'Guardando...';
            
            try {
                const res = await fetch('/api/auth/cliente/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Ocurrió un error');
                
                successMsg.innerText = data.message;
                successMsg.classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.href = '/loginuser.html';
                }, 3000);
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.innerText = 'Guardar Contraseña';
            }
        });
    </script>
</body>
</html>
