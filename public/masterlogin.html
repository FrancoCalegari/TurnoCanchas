<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta name="theme-color" content="#161d2e">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso MasterAdmin - ServicioDigital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0f1117;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(26, 31, 46, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            @apply w-full px-4 py-3.5 rounded-xl bg-[#0b0d14]/60 border border-slate-700/60 text-white placeholder:text-slate-500/70 hover:border-purple-500/40 hover:bg-[#0b0d14]/80 focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/15 focus:bg-[#0f1117] transition-all duration-300 text-sm font-semibold shadow-[inset_0_2px_8px_rgba(0, 0, 0, 0.5)];
        }

        .btn-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.4);
        }

        .btn-gradient:hover {
            box-shadow: 0 15px 35px -5px rgba(168, 85, 247, 0.6);
            transform: translateY(-1px);
        }

        .input-field {
            width: 100%;
            background-color: rgba(30, 41, 59, 0.5);
            /* slate-800/50 */
            border: 1px solid rgba(51, 65, 85, 0.6);
            /* slate-700/60 */
            border-radius: 0.75rem;
            /* rounded-xl */
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.875rem;
            transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
        }

        .input-field::placeholder {
            color: #64748b;
            /* slate-500 */
        }

        .input-field:focus {
            outline: none;
            border-color: #a855f7;
            /* purple-500 */
            background-color: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        .input-field:hover:not(:focus) {
            border-color: rgba(168, 85, 247, 0.4);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans antialiased relative overflow-x-hidden">

    <!-- Background Orbs (Purple/Pink Theme) -->
    <div
        class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-purple-600/20 blur-[120px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-fuchsia-600/10 blur-[120px] pointer-events-none">
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800/60 px-6 py-4 relative z-10 bg-[#0f1117]/80 backdrop-blur-md">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
                <img src="/img/logo.jpg" alt="Logo ServicioDigital"
                    class="w-10 h-10 rounded-xl shadow-lg object-cover group-hover:scale-105 transition-transform duration-300">
                <div>
                    <span
                        class="block text-sm font-black tracking-tight text-white leading-none mb-1">ServicioDigital</span>
                    <span
                        class="block text-[10px] font-bold text-purple-400 uppercase tracking-widest leading-none">Plataforma
                        Base</span>
                </div>
            </a>
            <a href="/"
                class="px-4 py-2 text-xs font-bold text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-700/50 rounded-lg border border-slate-700/50 transition-all">
                Volver al Inicio &rarr;
            </a>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 flex items-center justify-center px-4 py-12 relative z-10">
        <div class="w-full max-w-sm">

            <!-- Hero -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-black tracking-wide mb-5 uppercase">
                    Control Total
                </div>
                <h1 class="text-3xl font-black tracking-tight mb-2 text-white">
                    Panel <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-fuchsia-400">Master</span>
                </h1>
                <p class="text-slate-400 font-medium text-sm">
                    Ingresa con credenciales de superadmin.
                </p>
            </div>

            <!-- Form Card -->
            <div class="glass-panel rounded-[2rem] p-8 relative overflow-hidden">
                <!-- Highlight line at top -->
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-fuchsia-500 to-purple-500">
                </div>

                <form id="login-form" class="space-y-5">

                    <div id="error-msg"
                        class="hidden px-4 py-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold flex items-start gap-2 mb-4">
                        <svg class="w-4 h-4 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" y1="8" x2="12" y2="12" />
                            <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        <span id="error-text">Credenciales incorrectas.</span>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Usuario</label>
                        <input type="text" id="username" placeholder="admin" required class="input-field">
                    </div>

                    <div class="space-y-1.5">
                        <label
                            class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Contrase&ntilde;a</label>
                        <input type="password" id="password"
                            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required class="input-field">
                    </div>

                    <button type="submit" id="btn-submit"
                        class="w-full py-3.5 btn-gradient text-white font-black text-sm rounded-xl transition-all mt-6 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <span>Ingresar a Master Control</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14" />
                            <path d="m12 5 7 7-7 7" />
                        </svg>
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- API Connection -->
    <script src="js/api.js"></script>
    <script>
        const ORIGINAL_BTN = '<span>Ingresar a Master Control</span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        const LOADING_BTN = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Validando...';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            const errorTxt = document.getElementById('error-text');

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = LOADING_BTN;
            errorMsg.classList.add('hidden');

            try {
                const res = await window.API.masterLogin(user, pass);
                // Store with the superadmin format expected by the middleware
                localStorage.setItem('masterToken', res.token);
                localStorage.setItem('masterUser', res.username);
                window.location.href = '/masteradmin.html';
            } catch (err) {
                errorTxt.textContent = err.message || 'Credenciales incorrectas.';
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = ORIGINAL_BTN;
            }
        });

        // Check if already logged in
        if (localStorage.getItem('masterToken')) {
            window.location.href = '/masteradmin.html';
        }
    </script>
</body>

</html>
