<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50 dark:bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso MasterAdmin - TurnoCanchas</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex items-center justify-center p-4 text-slate-900 dark:text-slate-100">

    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-slate-900/50 overflow-hidden border border-slate-100 dark:border-slate-700/50">
        
        <div class="p-8 text-center bg-purple-600">
            <h1 class="text-2xl font-black text-white tracking-tight">TurnoCanchas</h1>
            <p class="text-purple-100/80 font-medium text-sm mt-1">Master Admin Control Panel</p>
        </div>

        <div class="p-8">
            <form id="login-form" class="space-y-5">
                <div id="error-msg" class="hidden p-3 bg-rose-50 text-rose-600 dark:bg-rose-900/30 dark:text-rose-400 rounded-xl text-sm font-bold border border-rose-100 dark:border-rose-800/50 text-center">
                    Credenciales incorrectas.
                </div>

                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-600 dark:text-slate-400 ml-1">Usuario</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-medium placeholder-slate-400">
                </div>

                <div class="space-y-1.5">
                    <label class="text-sm font-bold text-slate-600 dark:text-slate-400 ml-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-medium placeholder-slate-400">
                </div>

                <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold transition-all shadow-lg shadow-purple-600/20 mt-4 flex items-center justify-center gap-2">
                    Ingresar a Master Control
                </button>
            </form>
        </div>
    </div>

    <!-- API Connection -->
    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('error-msg');
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = 'Validando...';
            errorMsg.classList.add('hidden');

            try {
                await window.API.masterLogin(user, pass);
                window.location.href = '/masteradmin.html';
            } catch (err) {
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Ingresar a Master Control';
            }
        });

        // Check if already logged in
        if (localStorage.getItem('masterToken')) {
            window.location.href = '/masteradmin.html';
        }
    </script>
</body>
</html>
