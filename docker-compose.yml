services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnocanchas-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./public/uploads:/usr/src/app/public/uploads

